<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>
  <video id="video" controls autoplay playsinline webkit-playsinline></video>

  <script>
    const SRC = 'https://d2qh3gh0k5vp3v.cloudfront.net/v1/manifest/3722c60a815c199d9c0ef36c5b73da68a62b09d1/cc-n6pess5lwbghr/9e019606-f999-49d5-9a51-c0c3201aee4c/0.m3u8';
    const video = document.getElementById('video');
    let hls = null;
    let started = false;

    function forcePlayWithSound() {
      video.muted = false;
      video.volume = 1.0;

      const promise = video.play();
      if (promise !== undefined) {
        promise.then(() => {
          started = true;
        }).catch(() => {
          video.muted = true;
          video.play().then(() => {
            started = true;
            setTimeout(() => { video.muted = false; video.volume = 1.0; }, 100);
            setTimeout(() => { video.muted = false; video.volume = 1.0; }, 500);
            setTimeout(() => { video.muted = false; video.volume = 1.0; }, 1500);
          }).catch(() => {});
        });
      }
    }

    function start() {
      if (started) return;
      forcePlayWithSound();
    }

    function init() {
      if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = SRC;
        video.addEventListener('loadedmetadata', start);
        video.addEventListener('canplay', start);
        video.addEventListener('error', loadHls);
        setTimeout(start, 600);
        setTimeout(start, 1500);
        return;
      }
      loadHls();
    }

    function loadHls() {
      if (typeof Hls === 'undefined' || !Hls.isSupported()) return;
      if (hls) hls.destroy();

      hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
        backBufferLength: 60,
        maxBufferLength: 30
      });

      hls.loadSource(SRC);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, start);
      hls.on(Hls.Events.LEVEL_LOADED, start);
      hls.on(Hls.Events.FRAG_LOADED, () => {
        if (!started) start();
      });

      hls.on(Hls.Events.ERROR, (e, data) => {
        if (data.fatal) {
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            setTimeout(() => hls.startLoad(), 1200);
          } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            hls.recoverMediaError();
          }
        }
      });
    }

    function ensureSound() {
      video.muted = false;
      video.volume = 1.0;
      video.play().catch(() => {});
    }
    ['click', 'touchstart', 'keydown', 'pointerdown', 'mousedown'].forEach(function(evt) {
      document.addEventListener(evt, ensureSound, { once: false, passive: true });
    });

    init();
  </script>
</body>
</html>
