<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>
  <video id="video" controls autoplay muted playsinline webkit-playsinline></video>

  <script>
    const SRC = 'https://d2qh3gh0k5vp3v.cloudfront.net/v1/manifest/3722c60a815c199d9c0ef36c5b73da68a62b09d1/cc-n6pess5lwbghr/9e019606-f999-49d5-9a51-c0c3201aee4c/0.m3u8';
    const video = document.getElementById('video');
    let hls = null;
    let started = false;

    function startPlay() {
      if (started) return;
      started = true;

      video.muted = true;
      video.volume = 1;

      video.play().then(() => {
        setTimeout(() => { video.muted = false; }, 300);
      }).catch(() => {
        setTimeout(() => {
          video.muted = true;
          video.play().then(() => {
            video.muted = false;
          }).catch(() => {});
        }, 500);
      });
    }

    function init() {
      if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = SRC;
        video.addEventListener('loadedmetadata', startPlay);
        video.addEventListener('canplay', startPlay);
        video.addEventListener('error', loadHls);
        setTimeout(startPlay, 800);
        return;
      }
      loadHls();
    }

    function loadHls() {
      if (typeof Hls === 'undefined' || !Hls.isSupported()) return;
      if (hls) hls.destroy();

      hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
        backBufferLength: 60,
        maxBufferLength: 30
      });

      hls.loadSource(SRC);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, startPlay);
      hls.on(Hls.Events.LEVEL_LOADED, startPlay);

      hls.on(Hls.Events.ERROR, (e, data) => {
        if (data.fatal) {
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            setTimeout(() => hls.startLoad(), 1500);
          } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            hls.recoverMediaError();
          }
        }
      });
    }

    function unmute() {
      video.muted = false;
      video.volume = 1;
      video.play().catch(() => {});
    }
    document.addEventListener('click', unmute, { once: true });
    document.addEventListener('touchstart', unmute, { once: true });
    document.addEventListener('keydown', unmute, { once: true });

    init();
  </script>
</body>
</html>
