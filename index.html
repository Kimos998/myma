<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>
  <video id="video" autoplay muted playsinline webkit-playsinline controls></video>

  <script>
    const SRC = 'https://d2qh3gh0k5vp3v.cloudfront.net/v1/manifest/3722c60a815c199d9c0ef36c5b73da68a62b09d1/cc-n6pess5lwbghr/9e019606-f999-49d5-9a51-c0c3201aee4c/0.m3u8';
    const video = document.getElementById('video');
    let hls = null;

    function keepTryingPlay() {
      if (!video.paused && video.currentTime > 0) {
        video.muted = false;
        video.volume = 1;
        return;
      }

      video.muted = true;
      const p = video.play();
      if (p && p.catch) {
        p.catch(function () {});
      }

      setTimeout(keepTryingPlay, 400);
    }

    function onReady() {
      keepTryingPlay();

      video.addEventListener('playing', function once() {
        video.muted = false;
        video.volume = 1;
        video.removeEventListener('playing', once);
      });
    }

    function init() {
      if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = SRC;
        video.addEventListener('loadedmetadata', onReady);
        video.addEventListener('canplay', onReady);
        video.addEventListener('error', loadHls);
        setTimeout(onReady, 500);
        return;
      }
      loadHls();
    }

    function loadHls() {
      if (typeof Hls === 'undefined' || !Hls.isSupported()) return;
      if (hls) hls.destroy();

      hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
        backBufferLength: 90,
        maxBufferLength: 40,
        startLevel: -1
      });

      hls.loadSource(SRC);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, onReady);
      hls.on(Hls.Events.LEVEL_LOADED, onReady);
      hls.on(Hls.Events.FRAG_BUFFERED, onReady);

      hls.on(Hls.Events.ERROR, function (e, data) {
        if (data.fatal) {
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            setTimeout(function () { hls.startLoad(); }, 1000);
          } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            hls.recoverMediaError();
          }
        }
      });
    }

    function userAction() {
      video.muted = false;
      video.volume = 1;
      video.play().catch(function () {});
    }
    document.addEventListener('click', userAction);
    document.addEventListener('touchstart', userAction);
    document.addEventListener('keydown', userAction);

    init();
  </script>
</body>
</html>
